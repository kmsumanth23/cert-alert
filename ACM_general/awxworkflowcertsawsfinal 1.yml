---
# gcp-shared-services/playbooks/awx/kube/awx-workflow-certs-aws.yml
#
# Builds ONE consolidated AWS cert-renewal workflow per client group.
# See ACM_CERT_AUTOMATION_REFERENCE.md for the full design, variable
# reference and troubleshooting.
#
#   MAIN workflow   : run with no extra vars. Scope = every client-env with
#                     refresh_certs: true in aws-client-vars-env.yml.
#   GROUP workflow  : run with acm_cert_group: <group>. Scope, cert-data repo,
#                     job template, workflow and schedule names all come from
#                     client_parent.<group> in common/vars/client-mapping.yml.
#
# Adding a client group is a DATA change — no code change.
#
# Include this file ONCE per generator run (it discovers all clients itself),
# NOT inside the per-client loop that includes awx-workflow-certs.yml.

- name: Reset AWS consolidated cert workflow facts
  set_fact:
    aws_cert_envs: []
    aws_cert_workflow_nodes: []
    awx_workflow_certs_aws: []
    # Group mode is ON whenever a group name is supplied. The value IS the
    # group key in client_parent — no group name appears anywhere in code.
    acm_group_mode: "{{ acm_cert_group is defined and (acm_cert_group | length > 0) }}"

# Step 0 (group mode only) — resolve the group's configuration from the central
# mapping: gcp-shared-services/playbooks/awx/kube/common/vars/client-mapping.yml
#
#   client_parent:
#     <group>:
#       clients:        [<client>, ...]        # required
#       git_project:    <repo dir>             # required — holds the cert data
#       cert_vars_file: <path within git repo> # optional, group conventions
#       dns_file:       <filename pattern>     # optional, {{ env }} placeholder
#       job_template:   <AWX JT name>          # optional
#       workflow_name:  <AWX workflow name>    # optional
#       schedule:       <AWX schedule name>    # optional
#
# Adding a group is a DATA change: add a block here, run the generator with
# acm_cert_group: <group>. No code change.
#
# If the init playbook already loaded the file, `client_parent` is in scope and
# is used as-is; otherwise it is read from disk.
- name: Load the central client mapping
  set_fact:
    acm_client_parent: >-
      {{ client_parent
         | default((lookup('file', acm_client_mapping_path) | from_yaml).client_parent | default({}), true) }}
  vars:
    acm_client_mapping_path: >-
      {{ acm_client_mapping_file
         | default((base_src | default('/runner/project'))
                   ~ '/playbooks/awx/kube/common/vars/client-mapping.yml', true) }}
  when: acm_group_mode | bool

- name: Resolve configuration for cert group '{{ acm_cert_group | default('') }}'
  set_fact:
    acm_group_cfg: "{{ acm_client_parent[acm_cert_group] | default({}) }}"
  when: acm_group_mode | bool

- name: Assert the cert group resolved
  assert:
    that:
      - acm_group_cfg.clients | default([]) | length > 0
      - acm_group_cfg.git_project | default('') | length > 0
    fail_msg: >-
      Could not resolve client_parent['{{ acm_cert_group | default('') }}']
      (clients + git_project) from the client mapping. Known groups:
      {{ acm_client_parent | default({}) | list }}. Check the keys in
      common/vars/client-mapping.yml, or override acm_client_mapping_file.
  when: acm_group_mode | bool

# Resolve every group-derived name and path ONCE, so no consumer rebuilds
# them. Each falls back: explicit extra var -> group mapping entry -> default.
- name: Resolve workflow, schedule and job-template names
  set_fact:
    acm_group_jt_name: >-
      {{ acm_job_template_override
         | default((acm_group_cfg | default({})).job_template
                   | default('Import Certificate to ACM in AWS', true), true) }}
    acm_group_schedule_name: >-
      {{ acm_schedule_override
         | default((acm_group_cfg | default({})).schedule
                   | default('Runs daily certs', true), true) }}
    acm_group_workflow_name: >-
      {{ acm_workflow_name_override
         | default((acm_group_cfg | default({})).workflow_name
                   | default(('renew certs - aws - ' ~ acm_cert_group ~ ' clients')
                             if (acm_group_mode | bool)
                             else 'renew certs - aws - all clients', true), true) }}

# Group data paths. Resolved inside the JOB's checkout, so git_project must be
# a submodule of aws-v9-automation. Empty in main mode — nothing reads them.
- name: Resolve group data-file paths
  set_fact:
    acm_group_dns_file_resolved: >-
      {{ acm_group_dns_file
         | default(acm_base ~ '/' ~ acm_group_cfg.git_project ~ '/'
                   ~ (acm_group_cfg.dns_file
                      | default('hclsoftware-cloud-dns-ENV.yml', true)
                      | replace('{{ env }}', acm_dns_env)
                      | replace('ENV', acm_dns_env)), true) }}
    acm_group_vars_file_resolved: >-
      {{ acm_group_vars_file
         | default(acm_base ~ '/gcp-shared-services/'
                   ~ (acm_group_cfg.cert_vars_file
                      | default('playbooks/dns/cloud-cert-vars.yml', true)), true) }}
    # Passed to the job purely so the cert-vars file's own {{ }} entries can
    # render there. See "Snapshot cert-group conventions" in the parent playbook.
    acm_group_git_project_resolved: "{{ (acm_group_cfg | default({})).git_project | default('', true) }}"
    acm_group_dns_env_resolved: "{{ acm_dns_env }}"
  vars:
    acm_base: "{{ base_src | default('/runner/project') }}"
    acm_dns_env: "{{ acm_group_dns_env | default('prod') }}"
  when: acm_group_mode | bool

- name: Default group data-file paths in main mode
  set_fact:
    acm_group_dns_file_resolved: ''
    acm_group_vars_file_resolved: ''
    acm_group_git_project_resolved: ''
    acm_group_dns_env_resolved: ''
  when: not (acm_group_mode | bool)

- name: Print resolved cert group configuration
  debug:
    msg: >-
      Cert group '{{ acm_cert_group | default('(main)') }}':
      clients={{ (acm_group_cfg | default({})).clients | default('(all with refresh_certs)') }},
      git_project={{ (acm_group_cfg | default({})).git_project | default('(n/a)') }},
      dns_file={{ acm_group_dns_file_resolved }},
      vars_file={{ acm_group_vars_file_resolved }},
      job_template={{ acm_group_jt_name }},
      workflow={{ acm_group_workflow_name }},
      schedule={{ acm_group_schedule_name }}

# Step 1 — Discover every AWS client-env opted into cert renewal
- name: Discover AWS client environments with refresh_certs enabled
  set_fact:
    aws_cert_envs: "{{ aws_cert_envs + [env_entry] }}"
  with_community.general.filetree: "{{ hclnow_config_client_env }}"
  loop_control:
    loop_var: env
    label: "{{ env.path }} <{{ env.state }}>"
  when:
    - env.state == "directory"
    - env.path.split('/') | length == 2
    - aws_env_file is exists
    # TEST/MAINTENANCE OVERRIDE (inert in production — only active when
    # passed as an extra var): acm_test_ignore_refresh_flag=true lets
    # WHITELISTED envs in even when their refresh_certs flag is false/absent.
    # Deliberately inert unless acm_cert_env_whitelist is also defined, so it
    # can never widen production scope.

    # NOTE: refresh_certs is a GENERATOR-side flag only. Inside the job, the
    # cert-import include is gated on `certificates | length > 0` — an env
    # with no certificates configured runs as a no-op and publishes an EMPTY
    # report (fallback task in awsacmcertimportauto.yml), which is correct.
    # CAUTION: whitelisted envs that DO have certificates run the REAL cert
    # logic — a cert within its renewal threshold gets re-imported to ACM.
    # GROUP MODE: a group's clients have no refresh_certs var in the config
    # repo — membership of the group IS their opt-in, so the flag is bypassed
    # for them (and only for them).
    - >-
      (refresh_cert | bool)
      or ((acm_test_ignore_refresh_flag | default(false) | bool)
          and (acm_cert_env_whitelist is defined))
      or ((acm_group_mode | default(false) | bool)
          and (awx_client_code in acm_group_clients))

    # TEST/MAINTENANCE OVERRIDE: optional whitelist to limit scope (test
    # towers, emergency scope-reduction, or building team-scoped workflows).
    # Each entry may be EITHER a whole client ("hxtx" = all of hxtx's envs)
    # OR a single env ("hxtx/np" = just that env). Filtering at discovery
    # keeps nodes, chain links, and the digest's expected_reports manifest
    # consistent with each other.
    # Example (whole clients): -e '{"acm_cert_env_whitelist": ["hxtx","mosa","txle"]}'
    # Example (specific envs):  -e '{"acm_cert_env_whitelist": ["hxtx/np","hxsa/awsv9m"]}'
    # Leave UNDEFINED in production to include everything.
    # IMPORTANT: a whitelist alone rebuilds the SAME workflow with fewer
    # clients. To build a SEPARATE workflow, ALSO pass acm_workflow_name_override
    # (Step 4) — otherwise you shrink the main production workflow.
    - >-
      (acm_cert_env_whitelist is not defined)
      or (env.path in acm_cert_env_whitelist)
      or (awx_client_code in acm_cert_env_whitelist)

    # GROUP MODE: keep ONLY that group's clients. In normal (main) mode,
    # optionally SUBTRACT every grouped client so a stray refresh_certs: true
    # can never place one in two workflows.
    # The exclusion is OPT-IN (acm_group_exclude_from_main: true) because a
    # group's list may still contain a client that legitimately belongs to the
    # main workflow (e.g. one kept there for testing).
    - >-
      (acm_group_mode | default(false) | bool)
      | ternary(
          awx_client_code in acm_group_clients,
          not ((acm_group_exclude_from_main | default(false) | bool)
               and (awx_client_code in acm_all_grouped_clients))
        )
  vars:
    awx_client_code: "{{ env.path.split('/')[0] }}"
    awx_client_env: "{{ env.path.split('/')[1] }}"
    # This group's clients, and (for the main-workflow exclusion) the union of
    # every group's clients.
    acm_group_clients: "{{ (acm_group_cfg | default({})).clients | default([]) }}"
    acm_all_grouped_clients: >-
      {{ (acm_client_parent | default({})).values() | map(attribute='clients')
         | map('default', [], true) | list | flatten | unique }}
    aws_env_file: "{{ hclnow_config_client_env }}/{{ env.path }}/aws-client-vars-env.yml"
    default_path: "{{ hclnow_config_client_env }}/{{ awx_client_code }}/aws-client-vars.yml"

    # Custom-delimiter template trick (same as awx-workflow-certs.yml) on
    # BOTH lookups so regular {{ }} vars inside the client files (e.g.
    # {{ client_env_base }} in aws-client-vars.yml) pass through unrendered
    # instead of raising 'undefined variable' during discovery.
    env_file_vars: "{{ lookup('template', aws_env_file, errors='ignore', variable_start_string='[%', variable_end_string='%]') | from_yaml | default({}, true) }}"
    default_file_vars: "{{ lookup('template', default_path, errors='ignore', variable_start_string='[%', variable_end_string='%]') | from_yaml | default({}, true) }}"
    refresh_cert: "{{ env_file_vars.refresh_certs | default(false) }}"
    awx_infra_code: "{{ env_file_vars.client_infra_type | default(default_file_vars.client_infra_type | default(none)) }}"

    env_entry:
      client: "{{ awx_client_code }}"
      env: "{{ awx_client_env }}"
      infra_code: "{{ awx_infra_code }}"

- name: Print discovered AWS cert client-envs
  debug:
    msg: "{{ aws_cert_envs }}"

# Step 2 — Build per-client chained nodes, all converging on the digest node.
# Node identifier: node-<client>-<env>. Within a client, each env node
# always-links to the next env; the last env always-links to node-digest-report.
- name: Build per-client chained workflow nodes
  set_fact:
    aws_cert_workflow_nodes: >-
      {%- set nodes = [] -%}
      {%- set tickets = awx_renew_certs_tickets | default({}) -%}
      {%- for client, envs in aws_cert_envs | sort(attribute='client') | groupby('client') -%}
      {%-   set env_list = envs | sort(attribute='env') -%}
      {%-   for e in env_list -%}
      {%-     if loop.last -%}
      {%-       set next_ident = 'node-digest-report' -%}
      {%-     else -%}
      {%-       set next_ident = 'renew-cert-' ~ e.client ~ '-' ~ env_list[loop.index].env -%}
      {%-     endif -%}
      {%-     set node = {
                'identifier': 'renew-cert-' ~ e.client ~ '-' ~ e.env,
                'inventory': 'inventory_client_' ~ e.client ~ '_' ~ e.env,
                'unified_job_template': {'name': acm_group_jt_name, 'type': 'job_template'},
                'extra_data': {
                  'prod_ticket': tickets.get(e.client, {}).get(e.infra_code, ''),
                  'infra_code': e.infra_code,
                  'now_cloud': 'aws',
                  'acm_report_client': e.client,
                  'acm_report_env': e.env
                },
                'related': {'always_nodes': [next_ident]}
              } -%}
      {#-     GROUP MODE: acm_cert_group tells the job to source `certificates`
              from the group's repo instead of tools.yml, and selects the
              group's alert recipients. NOTE: acm_report_only is deliberately
              NOT pinned here — node extra_data outranks anything passed at
              workflow-launch time, so a read-only run could not be requested
              without regenerating. It is baked in only when the operator
              passes it explicitly at generation time. -#}
      {%-     if acm_group_mode | default(false) | bool -%}
      {%-       set node = node | combine({'extra_data':
                  node.extra_data | combine({
                    'acm_cert_group': acm_cert_group,
                    'acm_group_dns_file': acm_group_dns_file_resolved,
                    'acm_group_vars_file': acm_group_vars_file_resolved,
                    'acm_group_git_project': acm_group_git_project_resolved,
                    'acm_group_dns_env': acm_group_dns_env_resolved
                  })
                }) -%}
      {%-       if acm_report_only is defined -%}
      {%-         set node = node | combine({'extra_data':
                    node.extra_data | combine({'acm_report_only': acm_report_only}) }) -%}
      {%-       endif -%}
      {%-     endif -%}
      {#-     PRODUCTION: nodes run the JT's default SCM branch. Pass
              acm_scm_branch_override as an extra var to pin a test branch
              (as was done during the PoC with sum-cert-alert-aws). -#}
      {%-     if acm_scm_branch_override is defined -%}
      {%-       set node = node | combine({'scm_branch': acm_scm_branch_override}) -%}
      {%-     endif -%}
      {%-     set _ = nodes.append(node) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ nodes }}
  when: aws_cert_envs | length > 0

# Step 3 — Append the digest convergence node.
# extra_data.expected_reports is the manifest the digest playbook uses to
# detect branches that died before publishing an artifact.
- name: Append digest report convergence node
  set_fact:
    aws_cert_workflow_nodes: "{{ aws_cert_workflow_nodes + [digest_node] }}"
  vars:
    # NOTE: ONE vars: block only. A second vars: key on the same task silently
    # replaces this one (YAML duplicate key), leaving digest_node undefined.
    digest_node:
      identifier: node-digest-report
      all_parents_must_converge: true
      # This inventory must EXIST in AWX (node creation resolves it by name)
      # but its CONTENTS are irrelevant: acm-cert-digest.yml targets implicit
      # localhost on the EE, so no client hosts are touched. Any existing
      # inventory works; override via acm_digest_inventory if the default
      # name is absent on your tower. Keep the digest JT's Limit field EMPTY.
      inventory: "{{ acm_digest_inventory | default('Localhost-HCLNOW-DevOps') }}"
      # CREATION-ONLY TEST PREREQ #1: AWX resolves this job template BY NAME
      # at workflow-creation time — create the 'ACM Certs Digest Report' JT
      # first (a stub pointing at any playbook is enough for the creation
      # test), or node creation fails and leaves a half-built workflow.
      unified_job_template:
        name: 'ACM Certs Digest Report'
        type: 'job_template'
      # In group mode the digest also needs the group's data-file path,
      # because the group's alert recipients (cert_report_subscriber) live
      # in that file.
      extra_data: >-
        {{ {'expected_reports': aws_cert_envs}
           | combine({'acm_cert_group': acm_cert_group,
                      'acm_group_dns_file': acm_group_dns_file_resolved}
                     if (acm_group_mode | default(false) | bool) else {}) }}
  when: aws_cert_envs | length > 0

- name: Print consolidated workflow nodes
  debug:
    msg: "{{ aws_cert_workflow_nodes }}"
  when: aws_cert_workflow_nodes | length > 0

# Step 4 — Build the single workflow object (same schema the per-client
# generator feeds into awx-create-workflow.yml / awx-create-schedule.yml).
#
# SEPARATE / SCOPED WORKFLOW: pass acm_workflow_name_override (+ a whitelist,
# Step 1) to build a distinct workflow for a subset of clients. The name
# override makes it its own AWX object, so the main "renew certs - aws - all
# clients" workflow is left untouched.
- name: Prepare consolidated AWS certs workflow template
  set_fact:
    awx_workflow_certs_aws:
      # Group mode gets its own name (from the mapping, or derived from the
      # group key), so it can never overwrite the main workflow.
      - name: "{{ acm_group_workflow_name }}"
        organization: "{{ default_support_org }}"
        ask_inventory_on_launch: false
        ask_scm_branch_on_launch: false
        # Lets an operator pass extra vars when LAUNCHING the workflow — this
        # is how a one-off read-only run is requested:
        #   acm_report_only: true
        # Workflow-level extra vars flow down to every node's job.
        ask_variables_on_launch: true
        state: present
        description: >-
          Consolidated AWS cert renewal{{
            (' — group: ' ~ acm_cert_group) if (acm_group_mode | bool)
            else ' across all clients'
          }}. One branch per client (envs sequential), converging on a single
          digest email. Driven by var refresh_certs in aws-client-vars-env.yml.
          Scheduled daily.
        workflow_nodes: "{{ aws_cert_workflow_nodes }}"
        # Schedule name is per-workflow; a scoped workflow gets its own
        # schedule object. Set `schedule:` on the group in client-mapping.yml,
        # or pass acm_schedule_override, if your tower needs unique names.
        schedule: ["{{ acm_group_schedule_name }}"]
        allow_simultaneous: false
  when: aws_cert_workflow_nodes | length > 1

# Step 4b — opt-in clean rebuild: delete the workflow being built BEFORE
# rebuilding it, so nodes+links are recreated from scratch (recovers from a
# half-built/linkless workflow left by an aborted earlier run). Targets the
# SAME name Step 4 builds, so with acm_workflow_name_override it deletes the
# scoped workflow, and without it the main one.
#   - clean-rebuild a scoped workflow: acm_workflow_name_override + whitelist + acm_test_workflow_delete: true
#   - (the leftover PoC "TEST renew certs - aws - all clients" workflow, if any,
#     is deleted in the AWX UI — it is no longer this task's default target)
# Inert (skipped) on any run without acm_test_workflow_delete.
- name: Delete target consolidated workflow before rebuild (opt-in)
  awx.awx.workflow_job_template:
    name: "{{ acm_group_workflow_name }}"
    organization: "{{ default_support_org }}"
    state: absent
    controller_host: "{{ awx_uri }}"
    controller_username: "{{ awx_username }}"
    controller_password: "{{ awx_password }}"
  when: acm_test_workflow_delete | default(false) | bool

# Step 5 — Create the workflow in AWX
- name: Create consolidated AWS certs workflow
  include_tasks:
    file: awx-create-workflow.yml
  loop: "{{ awx_workflow_certs_aws | list }}"
  loop_control:
    loop_var: job
    label: "{{ job.name }}"
  when:
    - awx_workflow_certs_aws is defined
    - awx_workflow_certs_aws | length > 0

